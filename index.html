document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

family:\"Inter\";font-style:normal;font-weight:700;font-display:swap;src:local(\"Inter Bold\"),url(\"9cd529a1-e996-43c3-a446-8ac3f4179965\") format(\"woff2\")}\n<\u002Fstyle>\n  <style>/* Beehive, Colour tokens\n * Palette from the Beehive brand book (North of Now). Primary + secondary,\n * plus the exact tints used throughout the .fig source. */\n:root {\n  /* ---- Primary ---- */\n  --bee-white: #FFFFFF;         /* Shine White */\n  --bee-red: #E00800;           /* Sunrise Red, Pantone 02347 C */\n  --bee-ink: #0F1430;           /* Deep Ocean Blue, Pantone P 18-9 C */\n\n  /* ---- Secondary (supporting only, never predominant) ---- */\n  --bee-green: #47CB6C;         /* Emerald Green */\n  --bee-burgundy: #4B0F1E;      /* Deep Burgundy */\n\n  /* ---- Red spectrum (branded, for gradients / depth) ---- */\n  --bee-red-deep: #A10600;      /* darker sunrise */\n  --bee-red-mid: #A90B0D;       /* red→maroon midpoint */\n  --bee-coral: #E8605B;         /* messaging-card coral tint */\n\n  /* ---- Ink spectrum ---- */\n  --bee-ink-900: #01071C;       /* near-black ocean */\n  --bee-ink-800: #0F1430;       /* base */\n  --bee-ink-700: #2C3149;       /* raised ink surface */\n  --bee-ink-600: #444964;       /* ink tint */\n\n  /* ---- Neutrals (UI greys) ---- */\n  --bee-grey-50: #F9F9FA;       /* app canvas */\n  --bee-grey-100: #F2F2F4;\n  --bee-grey-200: #E3E3E7;      /* hairline / border */\n  --bee-grey-300: #C3C4CB;      /* disabled / stroke */\n  --bee-grey-500: #808385;      /* muted text */\n  --bee-grey-600: #6B6E78;\n  --bee-grey-700: #4B4B4B;\n\n  /* ---- Semantic aliases ---- */\n  --surface-page: var(--bee-white);\n  --surface-canvas: var(--bee-grey-50);\n  --surface-card: var(--bee-white);\n  --surface-ink: var(--bee-ink);\n  --surface-ink-raised: var(--bee-ink-700);\n\n  --text-primary: var(--bee-ink);\n  --text-muted: var(--bee-grey-500);\n  --text-on-dark: var(--bee-white);\n  --text-on-dark-muted: rgba(255, 255, 255, 0.5);\n  --text-accent: var(--bee-red);\n\n  --border-hairline: var(--bee-grey-200);\n  --border-strong: var(--bee-grey-300);\n\n  --accent: var(--bee-red);\n  --accent-hover: var(--bee-red-deep);\n  --success: var(--bee-green);\n\n  /* ---- Brand gradients (film / illustration / UI panels only) ---- */\n  --grad-ink: radial-gradient(140% 120% at 21% 17%, var(--bee-ink-700) 28%, var(--bee-ink) 100%);   /* @kind color */\n  --grad-red: radial-gradient(120% 130% at 53% 25%, var(--bee-red) 0%, var(--bee-red-mid) 46%, var(--bee-burgundy) 100%);  /* @kind color */\n}\n<\u002Fstyle>\n  <style>/* Beehive typography tokens\n * Typeface: Inter (Google Fonts). Weights: 400 body, 500 UI labels and buttons,\n * 600 and 700 headings. No other weights.\n * Headings: sentence case, never uppercase. -2% tracking, 110% leading.\n * Type scale rule of thumb from the brand book: H2 is about 50% of H1, body about 25% of H1. */\n:root {\n  --font-sans: \"Inter\", system-ui, -apple-system, \"Segoe UI\", Roboto, Arial, sans-serif;\n\n  /* weights */\n  --fw-regular: 400;    /* @kind font */\n  --fw-medium: 500;     /* @kind font */\n  --fw-semibold: 600;   /* @kind font */\n  --fw-bold: 700;       /* @kind font */\n\n  /* display / heading scale (px) */\n  --fs-display: 90px;\n  --fs-h1: 80px;\n  --fs-h2: 50px;\n  --fs-h3: 40px;\n  --fs-h4: 30px;\n  --fs-h5: 24px;\n\n  /* body / ui scale */\n  --fs-lead: 20px;\n  --fs-body: 17px;\n  --fs-sm: 14px;\n  --fs-xs: 12px;\n\n  /* line heights */\n  --lh-tight: 1.0;      /* @kind font */\n  --lh-display: 1.1;    /* @kind font */\n  --lh-body: 1.5;       /* @kind font */\n\n  /* tracking */\n  --tracking-display: -0.02em;  /* @kind font */\n  --tracking-normal: 0;         /* @kind font */\n\n  /* semantic type aliases */\n  --text-display: var(--fw-bold) var(--fs-display)/var(--lh-display) var(--font-sans);\n  --text-h1: var(--fw-semibold) var(--fs-h1)/var(--lh-display) var(--font-sans);\n  --text-h2: var(--fw-semibold) var(--fs-h2)/var(--lh-display) var(--font-sans);\n  --text-h3: var(--fw-semibold) var(--fs-h3)/var(--lh-display) var(--font-sans);\n  --text-body: var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-sans);\n  --text-lead: var(--fw-regular) var(--fs-lead)/var(--lh-body) var(--font-sans);\n  --text-label: var(--fw-medium) var(--fs-body)/var(--lh-display) var(--font-sans);\n  --text-cta: var(--fw-medium) var(--fs-lead)/var(--lh-body) var(--font-sans);\n}\n<\u002Fstyle>\n  <style>/* Beehive, Spacing, radii, shadow, layout tokens */\n:root {\n  /* spacing scale */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;   /* page margin in the brand book */\n  --space-16: 64px;\n  --space-20: 77px;   /* section gap used across brand-book frames */\n  --space-24: 100px;\n\n  /* radii */\n  --radius-cta: 5px;     /* buttons / CTAs */\n  --radius-input: 5px;\n  --radius-md: 10px;     /* data-viz panels */\n  --radius-card: 20px;   /* brand cards */\n  --radius-pill: 50px;\n  --radius-full: 9999px;\n\n  /* shadows */\n  --shadow-card: 0px 4px 60px 0px rgba(0, 0, 0, 0.25);\n  --shadow-soft: 0px 4px 20px 0px rgba(0, 0, 0, 0.08);\n  --shadow-pop: 0px 8px 30px 0px rgba(15, 20, 48, 0.18);\n\n  /* hairline edge for panels on dark */\n  --edge-on-dark: inset 0 0 0 1px rgba(255, 255, 255, 0.2);  /* @kind shadow */\n\n  /* motion, \"Onward Motion\": controlled, forward, never bouncy */\n  --ease-onward: cubic-bezier(0.22, 0.61, 0.36, 1);  /* @kind other */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);     /* @kind other */\n  --dur-fast: 140ms;   /* @kind other */\n  --dur-base: 220ms;   /* @kind other */\n  --dur-slow: 400ms;   /* @kind other */\n\n  /* layout */\n  --page-margin: 48px;      /* @kind spacing */\n  --content-max: 1200px;    /* @kind spacing */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   Beehive Design System, global entry point\n   \"Beehive is t "),url(\"9cd529a1-e996-43c3-a446-8ac3f4179965\") format(\"woff2\")}\n\n/* Beehive, Colour tokens\n * Palette from the Beehive brand book (North of Now). Primary + secondary,\n * plus the exact tints used throughout the .fig source. */\n:root {\n  /* ---- Primary ---- */\n  --bee-white: #FFFFFF;         /* Shine White */\n  --bee-red: #E00800;           /* Sunrise Red, Pantone 02347 C */\n  --bee-ink: #0F1430;           /* Deep Ocean Blue, Pantone P 18-9 C */\n\n  /* ---- Secondary (supporting only, never predominant) ---- */\n  --bee-green: #47CB6C;         /* Emerald Green */\n  --bee-burgundy: #4B0F1E;      /* Deep Burgundy */\n\n  /* ---- Red spectrum (branded, for gradients / depth) ---- */\n  --bee-red-deep: #A10600;      /* darker sunrise */\n  --bee-red-mid: #A90B0D;       /* red→maroon midpoint */\n  --bee-coral: #E8605B;         /* messaging-card coral tint */\n\n  /* ---- Ink spectrum ---- */\n  --bee-ink-900: #01071C;       /* near-black ocean */\n  --bee-ink-800: #0F1430;       /* base */\n  --bee-ink-700: #2C3149;       /* raised ink surface */\n  --bee-ink-600: #444964;       /* ink tint */\n\n  /* ---- Neutrals (UI greys) ---- */\n  --bee-grey-50: #F9F9FA;       /* app canvas */\n  --bee-grey-100: #F2F2F4;\n  --bee-grey-200: #E3E3E7;      /* hairline / border */\n  --bee-grey-300: #C3C4CB;      /* disabled / stroke */\n  --bee-grey-500: #808385;      /* muted text */\n  --bee-grey-600: #6B6E78;\n  --bee-grey-700: #4B4B4B;\n\n  /* ---- Semantic aliases ---- */\n  --surface-page: var(--bee-white);\n  --surface-canvas: var(--bee-grey-50);\n  --surface-card: var(--bee-white);\n  --surface-ink: var(--bee-ink);\n  --surface-ink-raised: var(--bee-ink-700);\n\n  --text-primary: var(--bee-ink);\n  --text-muted: var(--bee-grey-500);\n  --text-on-dark: var(--bee-white);\n  --text-on-dark-muted: rgba(255, 255, 255, 0.5);\n  --text-accent: var(--bee-red);\n\n  --border-hairline: var(--bee-grey-200);\n  --border-strong: var(--bee-grey-300);\n\n  --accent: var(--bee-red);\n  --accent-hover: var(--bee-red-deep);\n  --success: var(--bee-green);\n\n  /* ---- Brand gradients (film / illustration / UI panels only) ---- */\n  --grad-ink: radial-gradient(140% 120% at 21% 17%, var(--bee-ink-700) 28%, var(--bee-ink) 100%);   /* @kind color */\n  --grad-red: radial-gradient(120% 130% at 53% 25%, var(--bee-red) 0%, var(--bee-red-mid) 46%, var(--bee-burgundy) 100%);  /* @kind color */\n}\n\n/* Beehive typography tokens\n * Typeface: Inter (Google Fonts). Weights: 400 body, 500 UI labels and buttons,\n * 600 and 700 headings. No other weights.\n * Headings: sentence case, never uppercase. -2% tracking, 110% leading.\n * Type scale rule of thumb from the brand book: H2 is about 50% of H1, body about 25% of H1. */\n:root {\n  --font-sans: \"Inter\", system-ui, -apple-system, \"Segoe UI\", Roboto, Arial, sans-serif;\n\n  /* weights */\n  --fw-regular: 400;    /* @kind font */\n  --fw-medium: 500;     /* @kind font */\n  --fw-semibold: 600;   /* @kind font */\n  --fw-bold: 700;       /* @kind font */\n\n  /* display / heading scale (px) */\n  --fs-display: 90px;\n  --fs-h1: 80px;\n  --fs-h2: 50px;\n  --fs-h3: 40px;\n  --fs-h4: 30px;\n  --fs-h5: 24px;\n\n  /* body / ui scale */\n  --fs-lead: 20px;\n  --fs-body: 17px;\n  --fs-sm: 14px;\n  --fs-xs: 12px;\n\n  /* line heights */\n  --lh-tight: 1.0;      /* @kind font */\n  --lh-display: 1.1;    /* @kind font */\n  --lh-body: 1.5;       /* @kind font */\n\n  /* tracking */\n  --tracking-display: -0.02em;  /* @kind font */\n  --tracking-normal: 0;         /* @kind font */\n\n  /* semantic type aliases */\n  --text-display: var(--fw-bold) var(--fs-display)/var(--lh-display) var(--font-sans);\n  --text-h1: var(--fw-semibold) var(--fs-h1)/var(--lh-display) var(--font-sans);\n  --text-h2: var(--fw-semibold) var(--fs-h2)/var(--lh-display) var(--font-sans);\n  --text-h3: var(--fw-semibold) var(--fs-h3)/var(--lh-display) var(--font-sans);\n  --text-body: var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-sans);\n  --text-lead: var(--fw-regular) var(--fs-lead)/var(--lh-body) var(--font-sans);\n  --text-label: var(--fw-medium) var(--fs-body)/var(--lh-display) var(--font-sans);\n  --text-cta: var(--fw-medium) var(--fs-lead)/var(--lh-body) var(--font-sans);\n}\n\n/* Beehive, Spacing, radii, shadow, layout tokens */\n:root {\n  /* spacing scale */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;   /* page margin in the brand book */\n  --space-16: 64px;\n  --space-20: 77px;   /* section gap used across brand-book frames */\n  --space-24: 100px;\n\n  /* radii */\n  --radius-cta: 5px;     /* buttons / CTAs */\n  --radius-input: 5px;\n  --radius-md: 10px;     /* data-viz panels */\n  --radius-card: 20px;   /* brand cards */\n  --radius-pill: 50px;\n  --radius-full: 9999px;\n\n  /* shadows */\n  --shadow-card: 0px 4px 60px 0px rgba(0, 0, 0, 0.25);\n  --shadow-soft: 0px 4px 20px 0px rgba(0, 0, 0, 0.08);\n  --shadow-pop: 0px 8px 30px 0px rgba(15, 20, 48, 0.18);\n\n  /* hairline edge for panels on dark */\n  --edge-on-dark: inset 0 0 0 1px rgba(255, 255, 255, 0.2);  /* @kind shadow */\n\n  /* motion, \"Onward Motion\": controlled, forward, never bouncy */\n  --ease-onward: cubic-bezier(0.22, 0.61, 0.36, 1);  /* @kind other */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);     /* @kind other */\n  --dur-fast: 140ms;   /* @kind other */\n  --dur-base: 220ms;   /* @kind other */\n  --dur-slow: 400ms;   /* @kind other */\n\n  /* layout */\n  --page-margin: 48px;      /* @kind spacing */\n  --content-max: 1200px;    /* @kind spacing */\n}\n\n<\u002Fstyle>\n  <script src=\"a4332839-010a-4baf-802c-e6d15b21e98c\"><\u002Fscript>\n  <script src=\"27bdec4c-4d17-4a59-ba0c-113adc730b8d\"><\u002Fscript>\n  <style>\n    body{margin:0;font-family:var(--font-sans);color:var(--bee-ink);background:var(--bee-grey-50);-webkit-font-smoothing:antialiased}\n    a{color:var(--bee-red)} a:hover{opacity:.7}\n    @keyframes bhRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n  <section data-screen-label=\"01 Start\" style=\"position:relative;overflow:hidden;min-height:100vh;background:var(--bee-ink);color:#fff;display:flex;flex-direction:column\">\n    <div data-fx=\"hex\" style=\"position:absolute;right:-220px;bottom:-260px;pointer-events:none\">\n      <div aria-hidden=\"true\" data-fx=\"par\" style=\"transition:transform 900ms cubic-bezier(0.22,0.61,0.36,1);width:640px;height:640px;background:var(--grad-red);clip-path:path('M239.9 40.1 Q320.0 0.0 400.1 40.1 L559.9 119.9 Q640.0 160.0 640.0 249.6 L640.0 390.4 Q640.0 480.0 559.9 520.1 L400.1 599.9 Q320.0 640.0 239.9 599.9 L80.1 520.1 Q0.0 480.0 0.0 390.4 L0.0 249.6 Q0.0 160.0 80.1 119.9 Z')\"><\u002Fdiv>\n    <\u002Fdiv>\n    <header style=\"position:relative;padding:32px clamp(20px,5vw,48px)\">\n      <img src=\"0db7de61-4337-4c77-8fc6-0fc6bf5a3b35\" alt=\"Beehive\" style=\"display:block;height:36px;width:auto\">\n    <\u002Fheader>\n    <div style=\"position:relative;flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:48px;align-items:center;max-width:1200px;width:100%;margin:0 auto;padding:24px clamp(20px,5vw,48px) 64px;box-sizing:border-box\">\n      <div style=\"display:flex;flex-direction:column;gap:24px;align-items:flex-start\">\n        <div data-fx=\"rise\" style=\"display:flex\"><x-import component-from-global-scope=\"BeehiveDesignSystem_483ad8.Badge\" tone=\"onDark\" hint-size=\"110px,28px\">Rep training<\u002Fx-import><\u002Fdiv>\n        <h1 data-fx=\"rise\" style=\"margin:0;font-size:clamp(44px,7vw,80px);font-weight:700;line-height:1.05;letter-spacing:-0.02em;text-wrap:balance\">HubSpot, done right<\u002Fh1>\n        <p data-fx=\"rise\" style=\"margin:0;font-size:20px;line-height:1.5;color:rgba(255,255,255,0.8);max-width:46ch;text-wrap:pretty\">How well do you really know the process? 39 quick questions on duplicates, ownership, lead sources and submissions. You'll see the reason after every answer.<\u002Fp>\n        <div data-fx=\"rise\" style=\"display:flex;flex-wrap:wrap;gap:12px 28px;font-size:16px;color:rgba(255,255,255,0.8)\">\n          <span style=\"display:flex;align-items:center;gap:8px\"><x-import component-from-global-scope=\"BeehiveDesignSystem_483ad8.Icon\" name=\"list\" color=\"#fff\" hint-size=\"24px,24px\"><\u002Fx-import>39 questions<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:8px\"><x-import component-from-global-scope=\"BeehiveDesignSystem_483ad8.Icon\" name=\"view-grid\" color=\"#fff\" hint-size=\"24px,24px\"><\u002Fx-import>8 sections<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:8px\"><x-import component-from-global-scope=\"BeehiveDesignSystem_483ad8.Icon\" name=\"clock\" color=\"#fff\" hint-size=\"24px,24px\"><\u002Fx-import>About 10 minutes<\u002Fspan>\n        <\u002Fdiv>\n        <div data-fx=\"rise\" style=\"display:flex;flex-direction:column;gap:12px;margin-top:8px\">\n          <span style=\"font-size:15px;font-weight:600;color:#fff\">Climb the hive<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n            <sc-for list=\"{{ ladder }}\" as=\"l\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <div style=\"display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:10px;box-shadow:var(--edge-on-dark);background:{{ l.bg }}\">\n                  <span style=\"font-size:15px;font-weight:600;color:#fff\">{{ l.name }}<\u002Fspan>\n                  <span style=\"font-size:13px;color:rgba(255,255,255,0.65)\">{{ l.req }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ l.arrow }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"rgba(255,255,255,0.5)\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <span style=\"font-size:15px;color:rgba(255,255,255,0.65)\">100 points per right answer, plus bonuses for streaks and quick answers.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <form data-fx=\"rise\" sc-camel-on-submit=\"{{ start }}\" style=\"background:#fff;color:var(--bee-ink);border-radius:20px;box-shadow:var(--shadow-card);padding:clamp(24px,4vw,40px);display:flex;flex-direction:column;gap:20px;max-width:460px;width:100%;justify-self:end;box-sizing:border-box\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <h2 style=\"margin:0;font-size:26px;font-weight:600;letter-spacing:-0.02em\">Before you start<\u002Fh2>\n          <p style=\"margin:0;font-size:16px;line-height:1.5;color:var(--bee-grey-600)\">Add your details so your score is saved against your name.<\u002Fp>\n        <\u002Fdiv>\n        <x-import component-from-global-scope=\"BeehiveDesignSystem_483ad8.Input\" label=\"Your name\" placeholder=\"Sara Al Mansoori\" auto-complete=\"name\" value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" error=\"{{ errName }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"BeehiveDesignSystem_483ad8.Input\" label=\"Work email\" type=\"text\" input-mode=\"email\" placeholder=\"{{ emailPlaceholder }}\" auto-complete=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" error=\"{{ errEmail }}\" hint-size=\"100%,72px\"><\u002Fx-import>\n        <button type=\"submit\" style=\"font-family:inherit;font-size:15px;font-weight:600;letter-spacing:0.01em;line-height:1;border-radius:999px;padding:16px 32px;border:none;cursor:pointer;background:var(--bee-red);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all 200ms cubic-bezier(0.22,0.61,0.36,1);width:100%\" style-hover=\"transform:translateY(-1px);box-shadow:0 8px 24px rgba(224,8,0,0.3)\" style-active=\"transform:translateY(0)\">Start the quiz<svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12h18m0 0-8.5-8.5M21 12l-8.5 8.5\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <p style=\"margin:0;font-size:14px;color:var(--bee-grey-600)\">Tip: press A to D to pick, Enter to check.<\u002Fp>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"02 Question\" style=\"min-height:100vh;background:var(--bee-grey-50);display:flex;flex-direction:column\">\n    <header style=\"position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--bee-grey-200)\">\n      <div style=\"max-width:800px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px\">\n        <img src=\"572d25e2-0478-4fc3-ade4-08f6dad4662d\" alt=\"Beehive\" style=\"display:block;height:28px;width:auto\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <sc-if value=\"{{ showStreak }}\">\n            <span id=\"bh-streak\" style=\"display:inline-flex\"><x-import component-from-global-scope=\"BeehiveDesignSystem_483ad8.Badge\" tone=\"red\" solid=\"{{ true }}\" icon=\"{{ flashIcon }}\" hint-size=\"100px,28px\">{{ streakText }}<\u002Fx-import><\u002Fspan>\n          <\u002Fsc-if>\n          <span style=\"display:flex;align-items:baseline;gap:4px;padding:6px 12px;border-radius:50px;background:var(--bee-grey-100)\"><span id=\"bh-points\" style=\"display:inline-block;font-size:16px;font-weight:600;color:var(--bee-ink);font-variant-
